name: SadiaAF — independent local coding model pilot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/director-model-pilot.yml'
      - 'scripts/ci/director-model-pilot.py'
      - 'scripts/ci/test-director-model-pilot.py'
      - 'src/utils/dates.ts'

permissions:
  contents: read

concurrency:
  group: sadiaaf-local-model-pilot-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  model-pilot:
    if: github.repository == 'Patricked-code/africafunds-market-data-pipeline' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/sadiaaf-agent-coordination-20261124' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Offline diagnostic protocol regression tests
        run: python3 scripts/ci/test-director-model-pilot.py
      - name: Determine whether the model recipe actually changed
        id: recipe
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          if [[ "$EVENT_ACTION" == synchronize && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- .github/workflows/director-model-pilot.yml scripts/ci/director-model-pilot.py scripts/ci/test-director-model-pilot.py src/utils/dates.ts; then
              echo 'MODEL_RECIPE_UNCHANGED: inference not executed; not a GREEN attestation'
              echo 'run_model=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'run_model=true' >> "$GITHUB_OUTPUT"
      - name: Real independent coding inference and isolated RED GREEN
        if: steps.recipe.outputs.run_model == 'true'
        run: python3 scripts/ci/director-model-pilot.py
