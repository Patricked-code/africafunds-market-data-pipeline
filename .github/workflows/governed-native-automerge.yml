name: SadiaAF — governed native auto-merge enrollment

# Trusted default-branch code. Never execute files/artifacts from a PR.
# workflow_run bypasses GitHub's public-repo pull_request_target default block
# scheduled for December 2, 2026.
on:
  workflow_run:
    workflows:
      - CI — AfricaFunds Market Data Pipeline
      - SadiaAF — isolated Docker runtime and PostgreSQL persistence smoke
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  # GitHub GraphQL enablePullRequestAutoMerge requires both Contents and PR write.
  # This token is used only by trusted main code; main is protected by GitHub ruleset.
  contents: write
  pull-requests: write

concurrency:
  group: sadiaaf-native-automerge-${{ github.event.workflow_run.head_sha || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  enroll-native-automerge:
    name: Governed native auto-merge eligibility
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main only (no PR head, no artifacts)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Enroll or revoke only after policy and SHA validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/governed-native-automerge.mjs
