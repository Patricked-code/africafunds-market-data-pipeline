name: CI — AfricaFunds Market Data Pipeline

on:
  pull_request:  # Validate stacked PRs and ordinary PRs with the same gate
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          PGUSER: africafunds
          POSTGRES_USER: africafunds
          POSTGRES_PASSWORD: ci-only-not-for-production
          POSTGRES_DB: africafunds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://africafunds:ci-only-not-for-production@localhost:5432/africafunds_ci
      RAW_ARCHIVE_DIR: ./data/raw
      ENABLE_SCHEDULER: 'false'
      LOG_LEVEL: warn
    steps:
      - name: Checkout the exact PR revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact reviewed dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: S1 deployment safety and shell syntax
        run: |
          bash -n deploy/s1/preflight.sh deploy/s1/deploy.sh deploy/s1/rollback.sh
          node --test test/s1-deployment-safety.test.mjs
      - name: S1 staging read-only preflight and image context safety
        run: |
          bash -n deploy/s1/staging-preflight.sh deploy/s1/staging-provision.sh
          node --test test/s1-staging-preflight.test.mjs test/s1-staging-provision.test.mjs
      - name: Validate Docker Compose model without starting containers
        run: |
          printf '%s\n' \
            'POSTGRES_DB=africafunds_ci' \
            'POSTGRES_USER=africafunds_ci' \
            'POSTGRES_PASSWORD=ci-only-not-for-production' \
            'DATABASE_URL=postgresql://africafunds_ci:ci-only-not-for-production@postgres:5432/africafunds_ci' \
            'ENABLE_SCHEDULER=false' \
            'API_BIND_PORT=18991' \
            'WEB_BIND_PORT=18992' > .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
          if docker compose config --services | grep -qx collector; then
            echo 'Collector unexpectedly enabled in default Compose profile' >&2
            exit 1
          fi
          docker compose --profile collection config --format json > /tmp/sadiaaf-compose.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const services = JSON.parse(readFileSync('/tmp/sadiaaf-compose.json','utf8')).services;
          assert.equal(services.collector.profiles?.[0], 'collection');
          assert.ok(services.postgres.volumes?.some(v => v.target === '/var/lib/postgresql/data' && v.type === 'volume'));
          assert.equal(services.api.ports?.[0]?.host_ip, '127.0.0.1');
          assert.equal(services.web.ports?.[0]?.host_ip, '127.0.0.1');
          assert.ok(!services.postgres.ports?.length, 'PostgreSQL must not be publicly port-mapped');
          assert.equal(services.collector.volumes?.find(v => v.target === '/app/data/raw')?.type, 'bind');
          console.log('Validated isolated DB volume, loopback API/web ports and opt-in collector profile');
          NODE
      - name: Build
        run: npm run build
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Reapply migrations (idempotency)
        run: npm run db:migrate
      - name: Seed source registry
        run: npm run db:seed
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Verify migration registry matches SQL files
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises';
          import pg from 'pg';
          const expected = (await readdir('sql/migrations')).filter(f => f.endsWith('.sql')).length;
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query('SELECT count(*)::int AS n FROM public.schema_migrations');
            const actual = rows[0].n;
            if (actual !== expected) throw new Error(`Expected ${expected} migrations, got ${actual}`);
            console.log(`Verified ${actual} recorded migrations`);
          } finally {
            await client.end();
          }
          NODE
      - name: Backfill claim PostgreSQL integration test
        run: node --import tsx --test test/integration/backfill-claim.test.ts
      - name: Backfill window gate PostgreSQL integration test
        run: node --import tsx --test test/integration/backfill-window.test.ts
      - name: Record smoke-check outcome
        if: always()
        run: |
          echo 'CI run: ${{ github.run_id }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Head SHA: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'The result is authoritative only in GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
